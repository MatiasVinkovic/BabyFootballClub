name: cpp pipeline

on:
  push:
    branches: [ main, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Outils de build et Qt minimal
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cppcheck \
            libxkbcommon-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6sql6-sqlite

      - name: Analyse statique (Erreurs majeures uniquement)
        run: |
          cppcheck --enable=error \
                   --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   src/

      - name: Configurer CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Vérifier la compilation
        run: cmake --build build