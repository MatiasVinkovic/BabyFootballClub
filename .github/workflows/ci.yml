name: CI Légère C++ / Qt

on:
  push:
    branches: [ main, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Dépendances système et Qt6 minimal
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cppcheck \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6sql6-sqlite

      - name: Analyse statique (Cppcheck)
        run: |
          cppcheck --enable=warning,performance \
                   --suppress=uninitMemberVarPrivate \
                   --inline-suppr \
                   --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   src/

      - name: Configurer CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Compiler (Vérifier que tout compile)
        run: cmake --build build

      - name: Exécuter les tests (si configurés)
        run: ctest --test-dir build --output-on-failure
